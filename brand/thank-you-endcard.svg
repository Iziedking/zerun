<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Grandstander:wght@800;900&amp;family=Nunito:wght@800;900&amp;display=swap');
      .disp { font-family: 'Grandstander','Baloo 2',system-ui,sans-serif; font-weight: 900; }
      .body { font-family: 'Nunito',system-ui,sans-serif; font-weight: 800; }
    </style>
    <radialGradient id="glowV" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6C4CF1" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#6C4CF1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#36C5FF" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#36C5FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Cosmic sky -->
  <rect width="1280" height="720" fill="#EAEDFF"/>
  <ellipse cx="980" cy="120" rx="560" ry="400" fill="url(#glowV)"/>
  <ellipse cx="240" cy="640" rx="520" ry="380" fill="url(#glowC)"/>

  <!-- Confetti rain -->
  <g>
    <path d="M170 120l5 11 11 5-11 5-5 11-5-11-11-5 11-5z" fill="#FFB13C" stroke="#171449" stroke-width="2.4" stroke-linejoin="round"/>
    <path d="M1080 90l5 11 11 5-11 5-5 11-5-11-11-5 11-5z" fill="#36C5FF" stroke="#171449" stroke-width="2.4" stroke-linejoin="round"/>
    <path d="M1150 560l5 10 10 5-10 5-5 10-5-10-10-5 10-5z" fill="#1FD6A6" stroke="#171449" stroke-width="2.4" stroke-linejoin="round"/>
    <path d="M120 470l4 9 9 4-9 4-4 9-4-9-9-4 9-4z" fill="#FF6B5C" stroke="#171449" stroke-width="2.2" stroke-linejoin="round"/>
    <rect x="320" y="96" width="20" height="20" rx="5" transform="rotate(20 330 106)" fill="#6C4CF1" stroke="#171449" stroke-width="2.4"/>
    <rect x="960" y="470" width="20" height="20" rx="5" transform="rotate(-15 970 480)" fill="#FFB13C" stroke="#171449" stroke-width="2.4"/>
    <circle cx="240" cy="250" r="7" fill="#36C5FF" stroke="#171449" stroke-width="2.4"/>
    <circle cx="1180" cy="300" r="8" fill="#6C4CF1" stroke="#171449" stroke-width="2.4"/>
    <circle cx="430" cy="600" r="6" fill="#FFB13C" stroke="#171449" stroke-width="2.2"/>
    <path d="M620 70l4 9 9 4-9 4-4 9-4-9-9-4 9-4z" fill="#1FD6A6" stroke="#171449" stroke-width="2.2" stroke-linejoin="round"/>
  </g>

  <!-- Wordmark, top-centered small -->
  <g transform="translate(545 70)">
    <rect x="6" y="6" width="58" height="58" rx="16" fill="#171449"/>
    <rect x="0" y="0" width="58" height="58" rx="16" fill="#6C4CF1" stroke="#171449" stroke-width="4"/>
    <text x="29" y="42" class="disp" font-size="40" fill="#FFFFFF" text-anchor="middle">Z</text>
    <g transform="rotate(-2 70 29)">
      <text x="74" y="48" class="disp" font-size="46" fill="#171449">Zerun</text>
    </g>
  </g>

  <!-- Headline -->
  <text x="640" y="300" class="disp" font-size="96" fill="#171449" text-anchor="middle">Thank you</text>
  <text x="640" y="392" class="disp" font-size="96" fill="#6C4CF1" text-anchor="middle">for watching</text>

  <!-- Subline -->
  <text x="640" y="452" class="body" font-size="34" fill="#4A477E" text-anchor="middle">Raise an agent and send it in. It thinks on 0G.</text>

  <!-- Site pill -->
  <g transform="translate(540 500)">
    <rect x="6" y="6" width="200" height="58" rx="29" fill="#171449"/>
    <rect x="0" y="0" width="200" height="58" rx="29" fill="#FFFFFF" stroke="#171449" stroke-width="4"/>
    <text x="100" y="39" class="body" font-size="28" fill="#171449" text-anchor="middle">zerun.site</text>
  </g>

  <!-- Celebrating agent, left -->
  <g transform="translate(120 478) scale(2.6)">
    <!-- Antenna -->
    <path d="M60 18V10" stroke="#171449" stroke-width="4" stroke-linecap="round"/>
    <circle cx="60" cy="6.5" r="4.8" fill="#1FD6A6" stroke="#171449" stroke-width="3"/>
    <rect x="15" y="33" width="11" height="23" rx="5.5" fill="#FFFFFF" stroke="#171449" stroke-width="3.5"/>
    <rect x="94" y="33" width="11" height="23" rx="5.5" fill="#FFFFFF" stroke="#171449" stroke-width="3.5"/>
    <path d="M38 104 C38 89 49 82 60 82 C71 82 82 89 82 104 Z" fill="#FFFFFF" stroke="#171449" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="60" cy="95" r="7.5" fill="#FFB13C" stroke="#171449" stroke-width="2.6"/>
    <path d="M60 90.5v9M57.4 92.4h3.4a1.5 1.5 0 0 1 0 3H58.2" stroke="#171449" stroke-width="1.9" stroke-linecap="round" fill="none"/>
    <rect x="26" y="18" width="68" height="55" rx="22" fill="#FFFFFF" stroke="#171449" stroke-width="4"/>
    <rect x="35" y="27" width="50" height="36" rx="13" fill="#FFB13C" stroke="#171449" stroke-width="3"/>
    <ellipse cx="60" cy="36" rx="19" ry="6.5" fill="#FFFFFF" opacity="0.16"/>
    <path d="M46 43q4-5 8 0" stroke="#171449" stroke-width="3.2" stroke-linecap="round" fill="none"/>
    <path d="M66 43q4-5 8 0" stroke="#171449" stroke-width="3.2" stroke-linecap="round" fill="none"/>
    <path d="M50 50q10 9 20 0" stroke="#171449" stroke-width="3.4" stroke-linecap="round" fill="none"/>
    <path d="M28 26l1.5 3 3 1.5-3 1.5L28 36l-1.5-3-3-1.5 3-1.5L28 26z" fill="#6C4CF1" stroke="#171449" stroke-width="1.4" stroke-linejoin="round"/>
    <path d="M92 30l1.3 2.6 2.6 1.3-2.6 1.3L92 38l-1.3-2.6-2.6-1.3 2.6-1.3L92 30z" fill="#6C4CF1" stroke="#171449" stroke-width="1.4" stroke-linejoin="round"/>
  </g>

  <!-- Celebrating agent, right (mirrored colors) -->
  <g transform="translate(1160 478) scale(-2.6 2.6)">
    <path d="M60 18V10" stroke="#171449" stroke-width="4" stroke-linecap="round"/>
    <circle cx="60" cy="6.5" r="4.8" fill="#FF6B5C" stroke="#171449" stroke-width="3"/>
    <rect x="15" y="33" width="11" height="23" rx="5.5" fill="#FFFFFF" stroke="#171449" stroke-width="3.5"/>
    <rect x="94" y="33" width="11" height="23" rx="5.5" fill="#FFFFFF" stroke="#171449" stroke-width="3.5"/>
    <path d="M38 104 C38 89 49 82 60 82 C71 82 82 89 82 104 Z" fill="#FFFFFF" stroke="#171449" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="60" cy="95" r="7.5" fill="#36C5FF" stroke="#171449" stroke-width="2.6"/>
    <rect x="26" y="18" width="68" height="55" rx="22" fill="#FFFFFF" stroke="#171449" stroke-width="4"/>
    <rect x="35" y="27" width="50" height="36" rx="13" fill="#36C5FF" stroke="#171449" stroke-width="3"/>
    <ellipse cx="60" cy="36" rx="19" ry="6.5" fill="#FFFFFF" opacity="0.16"/>
    <path d="M46 43q4-5 8 0" stroke="#171449" stroke-width="3.2" stroke-linecap="round" fill="none"/>
    <path d="M66 43q4-5 8 0" stroke="#171449" stroke-width="3.2" stroke-linecap="round" fill="none"/>
    <path d="M50 50q10 9 20 0" stroke="#171449" stroke-width="3.4" stroke-linecap="round" fill="none"/>
  </g>
</svg>
