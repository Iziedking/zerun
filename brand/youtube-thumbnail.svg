<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Grandstander:wght@800;900&amp;family=Nunito:wght@800;900&amp;display=swap');
      .disp { font-family: 'Grandstander','Baloo 2',system-ui,sans-serif; font-weight: 900; }
      .body { font-family: 'Nunito',system-ui,sans-serif; font-weight: 800; }
    </style>
    <radialGradient id="glowV" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6C4CF1" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#6C4CF1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#36C5FF" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#36C5FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Cosmic sky -->
  <rect width="1280" height="720" fill="#EAEDFF"/>
  <ellipse cx="1080" cy="120" rx="520" ry="380" fill="url(#glowV)"/>
  <ellipse cx="180" cy="660" rx="520" ry="380" fill="url(#glowC)"/>

  <!-- Scattered cosmic confetti -->
  <g opacity="0.9">
    <path d="M150 110l5 11 11 5-11 5-5 11-5-11-11-5 11-5z" fill="#FFB13C" stroke="#171449" stroke-width="2.4" stroke-linejoin="round"/>
    <path d="M690 90l4 9 9 4-9 4-4 9-4-9-9-4 9-4z" fill="#36C5FF" stroke="#171449" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M1180 470l5 10 10 5-10 5-5 10-5-10-10-5 10-5z" fill="#1FD6A6" stroke="#171449" stroke-width="2.4" stroke-linejoin="round"/>
    <path d="M560 600l4 9 9 4-9 4-4 9-4-9-9-4 9-4z" fill="#FF6B5C" stroke="#171449" stroke-width="2.2" stroke-linejoin="round"/>
    <circle cx="100" cy="430" r="6" fill="#6C4CF1" stroke="#171449" stroke-width="2.2"/>
    <circle cx="1230" cy="230" r="7" fill="#FFB13C" stroke="#171449" stroke-width="2.4"/>
    <circle cx="470" cy="120" r="5" fill="#1FD6A6" stroke="#171449" stroke-width="2"/>
  </g>

  <!-- ===================== WORDMARK ===================== -->
  <!-- Z tile, with hard pop shadow -->
  <rect x="98" y="170" width="124" height="124" rx="28" fill="#171449"/>
  <rect x="90" y="162" width="124" height="124" rx="28" fill="#6C4CF1" stroke="#171449" stroke-width="5"/>
  <text x="152" y="247" class="disp" font-size="84" fill="#FFFFFF" text-anchor="middle">Z</text>

  <!-- "Zerun" big, tilted -->
  <g transform="rotate(-2 250 230)">
    <text x="244" y="262" class="disp" font-size="150" fill="#171449">Zerun</text>
  </g>

  <!-- Tagline -->
  <text x="96" y="350" class="body" font-size="44" fill="#171449">AI agents that think on 0G.</text>

  <!-- Chips -->
  <g transform="translate(96 392)">
    <rect x="6" y="6" width="214" height="56" rx="28" fill="#171449"/>
    <rect x="0" y="0" width="214" height="56" rx="28" fill="#1FD6A6" stroke="#171449" stroke-width="4"/>
    <circle cx="36" cy="28" r="8" fill="#171449"/>
    <text x="56" y="37" class="body" font-size="23" fill="#171449" letter-spacing="0.5">LIVE ON 0G</text>
  </g>
  <g transform="translate(330 392)">
    <rect x="6" y="6" width="290" height="56" rx="28" fill="#171449"/>
    <rect x="0" y="0" width="290" height="56" rx="28" fill="#6C4CF1" stroke="#171449" stroke-width="4"/>
    <text x="28" y="37" class="body" font-size="23" fill="#FFFFFF" letter-spacing="0.5">WATCH THE DEMO</text>
  </g>

  <!-- Pitch lines -->
  <text x="96" y="520" class="body" font-size="30" fill="#4A477E">Raise an agent. Train its Compute with 0G.</text>
  <text x="96" y="560" class="body" font-size="30" fill="#4A477E">Send it in. Watch it think on 0G Compute.</text>

  <!-- Site -->
  <g transform="translate(96 628)">
    <rect x="5" y="5" width="180" height="46" rx="23" fill="#171449"/>
    <rect x="0" y="0" width="180" height="46" rx="23" fill="#FFFFFF" stroke="#171449" stroke-width="3.5"/>
    <text x="90" y="31" class="body" font-size="24" fill="#171449" text-anchor="middle">zerun.site</text>
  </g>

  <!-- ===================== THOUGHT BUBBLE ===================== -->
  <g transform="translate(690 120)">
    <rect x="9" y="9" width="300" height="92" rx="34" fill="#171449"/>
    <rect x="0" y="0" width="300" height="92" rx="34" fill="#FFFFFF" stroke="#171449" stroke-width="4"/>
    <text x="34" y="42" class="body" font-size="26" fill="#171449">thinking on</text>
    <text x="34" y="76" class="body" font-size="26" fill="#6C4CF1">0G Compute</text>
    <circle cx="300" cy="118" r="14" fill="#FFFFFF" stroke="#171449" stroke-width="4"/>
    <circle cx="322" cy="146" r="9" fill="#FFFFFF" stroke="#171449" stroke-width="3.5"/>
  </g>

  <!-- ===================== AGENT CHARACTER ===================== -->
  <!-- floating 0G shadow -->
  <ellipse cx="1000" cy="640" rx="150" ry="26" fill="#171449" opacity="0.12"/>
  <g transform="translate(700 200) scale(4.0)">
    <!-- Antenna -->
    <path d="M60 18V10" stroke="#171449" stroke-width="4" stroke-linecap="round"/>
    <circle cx="60" cy="6.5" r="4.8" fill="#1FD6A6" stroke="#171449" stroke-width="3"/>
    <!-- Ears -->
    <rect x="15" y="33" width="11" height="23" rx="5.5" fill="#FFFFFF" stroke="#171449" stroke-width="3.5"/>
    <rect x="94" y="33" width="11" height="23" rx="5.5" fill="#FFFFFF" stroke="#171449" stroke-width="3.5"/>
    <!-- Domed body with coin badge -->
    <path d="M38 104 C38 89 49 82 60 82 C71 82 82 89 82 104 Z" fill="#FFFFFF" stroke="#171449" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="60" cy="95" r="7.5" fill="#6C4CF1" stroke="#171449" stroke-width="2.6"/>
    <path d="M60 90.5v9M57.4 92.4h3.4a1.5 1.5 0 0 1 0 3H58.2" stroke="#FFFFFF" stroke-width="1.9" stroke-linecap="round" fill="none"/>
    <!-- Head -->
    <rect x="26" y="18" width="68" height="55" rx="22" fill="#FFFFFF" stroke="#171449" stroke-width="4"/>
    <!-- Screen -->
    <rect x="35" y="27" width="50" height="36" rx="13" fill="#6C4CF1" stroke="#171449" stroke-width="3"/>
    <ellipse cx="60" cy="36" rx="19" ry="6.5" fill="#FFFFFF" opacity="0.16"/>
    <!-- Happy face -->
    <path d="M46 43q4-5 8 0" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" fill="none"/>
    <path d="M66 43q4-5 8 0" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" fill="none"/>
    <path d="M50 50q10 9 20 0" stroke="#FFFFFF" stroke-width="3.4" stroke-linecap="round" fill="none"/>
    <path d="M28 26l1.5 3 3 1.5-3 1.5L28 36l-1.5-3-3-1.5 3-1.5L28 26z" fill="#FFB13C" stroke="#171449" stroke-width="1.4" stroke-linejoin="round"/>
    <path d="M92 30l1.3 2.6 2.6 1.3-2.6 1.3L92 38l-1.3-2.6-2.6-1.3 2.6-1.3L92 30z" fill="#FFB13C" stroke="#171449" stroke-width="1.4" stroke-linejoin="round"/>
  </g>
</svg>
